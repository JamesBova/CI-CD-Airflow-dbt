name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create runtime directories
        run: |
          mkdir -p airflow/logs
          mkdir -p airflow/dbt_profiles

      - name: Build Airflow image
        working-directory: airflow
        run: docker compose build

      - name: Run DAG tests
        working-directory: airflow
        run: |
          docker compose run --rm --entrypoint pytest \
            airflow-scheduler -v /opt/airflow/tests
      - name: Start warehouse
        working-directory: airflow
        run: docker compose up -d warehouse

      - name: Run dbt build
        working-directory: airflow
        run: |
          docker compose run --rm --entrypoint bash \
            airflow-scheduler -c "cd /opt/dbt/dbt_project && dbt build"