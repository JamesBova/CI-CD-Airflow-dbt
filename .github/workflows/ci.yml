name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create runtime directories
        run: |
          mkdir -p airflow/logs
          mkdir -p airflow/dbt_profiles

      - name: Build Airflow image
        working-directory: airflow
        run: docker compose build

      - name: Run DAG tests
        working-directory: airflow
        run: |
          docker compose run --rm --entrypoint pytest \
            airflow-scheduler -v /opt/airflow/tests
      - name: Start warehouse
        working-directory: airflow
        run: docker compose up -d warehouse
      - name: Create dbt profile for CI
        run: |
          cat > airflow/dbt_profiles/profiles.yml <<'EOF'
          ci_cd_dbt:
            target: dev
            outputs:
              dev:
                type: postgres
                host: warehouse
                port: 5432
                user: dbt
                password: dbt
                dbname: ci_cd_dbt
                schema: public
                threads: 2
          EOF
      - name: Make dbt directories writable
        run: |
          chmod -R a+rwX dbt_project
          chmod -R a+rwX airflow/dbt_profiles
      - name: Run dbt build
        working-directory: airflow
        run: |
          docker compose run --rm --entrypoint bash \
            airflow-scheduler -c "cd /opt/dbt/dbt_project && dbt build"